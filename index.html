<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- iOS: Safari ignores the manifest icons and needs these for "Zum Home-Bildschirm". -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="CoffeeChain" />
    <title>CoffeeChain</title>
    <style>
      /* Warm graphite ramp, one latte accent. Shared by the HUD and the start screen. */
      :root {
        --hud-bg: rgb(28 26 24 / 94%);
        --hud-fg: #efe9de;
        --fg-2: #c2baae;
        --fg-3: #9a9388;
        --raised: rgb(239 233 222 / 7%);
        --raised-hover: rgb(239 233 222 / 12%);
        --line: rgb(239 233 222 / 9%);
        --accent: #f2c48d;
        --on-accent: #1f1b16;
        --negative: #d9534a;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Visible scrollbars: standard width, a track and a thumb with enough contrast. */
      * {
        scrollbar-color: var(--fg-3) var(--raised);
      }
      #scene {
        display: block;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        /* Touch gestures go to the scene, not to the page zoom or scroll. */
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
